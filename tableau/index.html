<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Il mio tavolo – Congresso Nazionale Siena 2026</title>
    <meta
      name="description"
      content="Trova il tuo tavolo al Congresso Nazionale Siena 2026."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cranberry: #d41367;
        --cranberry-light: #f9d0e5;
        --cranberry-dark: #a50f50;
        --text: #1a1a2e;
        --text-secondary: #5a5a72;
        --bg: #f7f7fa;
        --card-bg: #ffffff;
        --border: #e2e2ee;
        --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.06);
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        --radius: 14px;
        --radius-sm: 8px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e8e8f4;
          --text-secondary: #9090aa;
          --bg: #0e0e1c;
          --card-bg: #181828;
          --border: #2a2a40;
        }
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Open Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      header {
        background: var(--cranberry);
        color: #fff;
        text-align: center;
        padding: 2.25rem 1.5rem 2rem;
      }

      header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 0.35rem;
      }

      header p {
        font-size: 0.95rem;
        font-weight: 300;
        opacity: 0.88;
      }

      main {
        flex: 1;
        max-width: 640px;
        width: 100%;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }

      .search-section {
        margin-bottom: 1.75rem;
      }

      .search-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-secondary);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 0.6rem;
      }

      .search-wrapper {
        position: relative;
      }

      .search-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--cranberry);
        pointer-events: none;
        display: flex;
      }

      .search-input {
        width: 100%;
        padding: 0.9rem 1rem 0.9rem 3rem;
        font-family: inherit;
        font-size: 1rem;
        border: 2px solid var(--border);
        border-radius: var(--radius);
        background: var(--card-bg);
        color: var(--text);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .search-input:focus {
        border-color: var(--cranberry);
        box-shadow: 0 0 0 4px rgba(212, 19, 103, 0.12);
      }

      .search-input::placeholder {
        color: #aaaacc;
      }

      .result-meta {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--text-secondary);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 0.85rem;
      }

      .guest-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.1rem 1.4rem;
        margin-bottom: 0.65rem;
        box-shadow: var(--shadow-sm);
        transition: transform 0.15s, box-shadow 0.15s;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .guest-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      .guest-name {
        font-size: 1rem;
        font-weight: 600;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .table-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: var(--cranberry-light);
        color: var(--cranberry-dark);
        font-family: inherit;
        font-size: 0.83rem;
        font-weight: 700;
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s, color 0.15s;
      }

      .table-badge:hover,
      .table-badge:focus-visible {
        background: var(--cranberry);
        color: #fff;
        outline: none;
      }

      .table-view {
        display: none;
      }

      .table-view.active {
        display: block;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        background: none;
        border: none;
        color: var(--cranberry);
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 0.4rem 0;
        margin-bottom: 1.5rem;
      }

      .back-btn:hover,
      .back-btn:focus-visible {
        opacity: 0.7;
        outline: none;
      }

      .table-heading {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1.4rem;
      }

      .table-heading-icon {
        width: 40px;
        height: 40px;
        background: var(--cranberry);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        flex-shrink: 0;
      }

      .table-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--cranberry);
      }

      .table-subtitle {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 0.1rem;
      }

      .diner-list {
        list-style: none;
      }

      .diner-item {
        padding: 0.75rem 1.2rem;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: 0.45rem;
        font-size: 0.95rem;
        box-shadow: var(--shadow-sm);
      }

      .diner-item.highlighted {
        border-color: var(--cranberry);
        background: var(--cranberry-light);
        font-weight: 700;
      }

      .state-box {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-secondary);
      }

      .state-icon {
        font-size: 2.6rem;
        margin-bottom: 1rem;
        display: block;
      }

      .state-title {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        color: var(--text);
      }

      .state-description {
        font-size: 0.875rem;
        line-height: 1.65;
      }

      .loader {
        text-align: center;
        padding: 3rem;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--cranberry-light);
        border-top-color: var(--cranberry);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        margin: 0 auto 1rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loader-text {
        font-size: 0.88rem;
        color: var(--text-secondary);
      }

      .config-notice {
        background: #fffbee;
        border: 1px solid #ffe082;
        border-radius: var(--radius);
        padding: 1.25rem 1.5rem;
        font-size: 0.875rem;
        line-height: 1.7;
        color: #6b5300;
      }

      .config-notice strong {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 1rem;
      }

      .config-notice code {
        font-family: "Courier New", monospace;
        font-size: 0.82em;
        background: rgba(0, 0, 0, 0.07);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }

      .config-list {
        margin-top: 0.75rem;
        padding-left: 1.1rem;
      }

      .config-list li + li {
        margin-top: 0.35rem;
      }

      footer {
        text-align: center;
        padding: 1.25rem;
        font-size: 0.72rem;
        color: var(--text-secondary);
        letter-spacing: 0.04em;
      }

      @media (max-width: 520px) {
        .guest-card {
          align-items: flex-start;
          flex-direction: column;
        }

        .table-badge {
          align-self: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Congresso Nazionale Siena 2026</h1>
      <p>Trova il tuo posto a tavola</p>
    </header>

    <main>
      <section class="search-section" aria-label="Ricerca commensale">
        <label for="search-input" class="search-label">Cerca il tuo nome</label>
        <div class="search-wrapper">
          <span class="search-icon" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Nome e cognome…"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Cerca il tuo nome"
          />
        </div>
      </section>

      <section
        id="results-section"
        aria-live="polite"
        aria-atomic="false"
        aria-label="Risultati ricerca"
      ></section>

      <section
        id="table-view"
        class="table-view"
        aria-label="Commensali al tavolo"
        aria-live="polite"
      ></section>
    </main>

    <footer>
      <p>Rotaract Club &mdash; Congresso Nazionale Siena 2026</p>
    </footer>

    <script type="module">
      /**
       * @typedef {Object} SheetsConfig
       * @property {string} apiKey
       * @property {string} spreadsheetId
       * @property {string} sheetName
       * @property {string} range
       */

      /**
       * @typedef {Object} Guest
       * @property {string} id
       * @property {string} fullName
       * @property {string} firstName
       * @property {string} lastName
       * @property {string} tableName
       * @property {string} searchText
       * @property {Record<string, string>} source
       */

      /** @type {SheetsConfig} */
      const DEFAULT_SHEETS_CONFIG = {
        apiKey: "",
        spreadsheetId: "",
        sheetName: "",
        range: "",
      };

      /** @type {Guest[]} */
      let allGuests = [];

      const resultsSection = /** @type {HTMLElement} */ (document.getElementById("results-section"));
      const tableViewElement = /** @type {HTMLElement} */ (document.getElementById("table-view"));
      const searchInput = /** @type {HTMLInputElement} */ (document.getElementById("search-input"));

      initialize().catch((error) => {
        console.error(error);
        renderLoadError();
      });

      async function initialize() {
        const config = getSheetsConfig();

        if (!hasSheetsConfig(config)) {
          searchInput.disabled = true;
          renderConfigNotice();
          hideTableView();
          return;
        }

        searchInput.disabled = true;
        renderLoader();
        hideTableView();

        const values = await fetchSheetValues(config);
        allGuests = normalizeGuests(values);
        searchInput.disabled = false;

        if (allGuests.length === 0) {
          renderNoData();
          return;
        }

        renderIdle();
      }

      /**
       * @returns {SheetsConfig}
       */
      function getSheetsConfig() {
        const params = new URLSearchParams(window.location.search);

        return {
          apiKey: params.get("apiKey")?.trim() ?? DEFAULT_SHEETS_CONFIG.apiKey,
          spreadsheetId:
            params.get("sheetId")?.trim() ?? DEFAULT_SHEETS_CONFIG.spreadsheetId,
          sheetName: params.get("sheet")?.trim() ?? DEFAULT_SHEETS_CONFIG.sheetName,
          range: params.get("range")?.trim() ?? DEFAULT_SHEETS_CONFIG.range,
        };
      }

      /**
       * @param {SheetsConfig} config
       * @returns {boolean}
       */
      function hasSheetsConfig(config) {
        return Boolean(config.apiKey && config.spreadsheetId && (config.range || config.sheetName));
      }

      /**
       * @param {SheetsConfig} config
       * @returns {Promise<string[][]>}
       */
      async function fetchSheetValues(config) {
        const range = config.range || config.sheetName;
        const encodedRange = encodeURIComponent(range);
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${config.spreadsheetId}/values/${encodedRange}?key=${config.apiKey}`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`Google Sheets API request failed with status ${response.status}`);
        }

        /** @type {{ values?: string[][], error?: { message?: string } }} */
        const data = await response.json();

        if (data.error?.message) {
          throw new Error(data.error.message);
        }

        return Array.isArray(data.values) ? data.values : [];
      }

      /**
       * @param {string[][]} values
       * @returns {Guest[]}
       */
      function normalizeGuests(values) {
        if (values.length === 0) {
          return [];
        }

        const [headers, ...dataRows] = values;

        return dataRows
          .map((rowValues, rowIndex) => {
            /** @type {Record<string, string>} */
            const rawRow = {};

            headers.forEach((header, headerIndex) => {
              rawRow[String(header ?? "").trim()] = String(rowValues[headerIndex] ?? "").trim();
            });

            const normalizedRow = Object.fromEntries(
              Object.entries(rawRow).map(([key, value]) => [normalizeHeader(key), value]),
            );

            const firstName =
              pickFirstValue(normalizedRow, ["nome", "firstname", "first", "givenname"]) ?? "";
            const lastName =
              pickFirstValue(normalizedRow, ["cognome", "lastname", "last", "surname"]) ?? "";
            const combinedName =
              pickFirstValue(normalizedRow, [
                "nomecognome",
                "nomeecognome",
                "fullname",
                "nomecompleto",
                "nominativo",
                "name",
                "guest",
                "ospite",
                "partecipante",
              ]) ?? "";
            const tableName =
              pickFirstValue(normalizedRow, [
                "tavolo",
                "table",
                "tableau",
                "tablename",
                "nometavolo",
                "tavoloassegnato",
                "table_name",
              ]) ?? "";

            const fullName = combinedName || [firstName, lastName].filter(Boolean).join(" ").trim();
            if (!fullName || !tableName) {
              return null;
            }

            return {
              id: `${rowIndex}-${normalizeText(fullName)}-${normalizeText(tableName)}`,
              fullName,
              firstName,
              lastName,
              tableName,
              searchText: normalizeText(fullName),
              source: rawRow,
            };
          })
          .filter((guest) => guest !== null);
      }

      function renderLoader() {
        resultsSection.innerHTML = `
          <div class="loader" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <p class="loader-text">Sto recuperando i tavoli dal foglio Google…</p>
          </div>
        `;
      }

      function renderIdle() {
        resultsSection.innerHTML = `
          <div class="state-box">
            <span class="state-icon" aria-hidden="true">🍽️</span>
            <p class="state-title">Inserisci nome e cognome</p>
            <p class="state-description">
              Inizia a digitare per trovare rapidamente il tuo tavolo e vedere con chi sei seduto.
            </p>
          </div>
        `;
      }

      function renderNoData() {
        resultsSection.innerHTML = `
          <div class="state-box">
            <span class="state-icon" aria-hidden="true">📭</span>
            <p class="state-title">Nessun invitato disponibile</p>
            <p class="state-description">
              Il foglio è stato letto correttamente, ma non contiene righe valide con nominativo e tavolo.
            </p>
          </div>
        `;
      }

      function renderConfigNotice() {
        resultsSection.innerHTML = `
          <div class="config-notice">
            <strong>Configurazione Google Sheets mancante</strong>
            Inserisci nel file HTML oppure nella query string i valori per
            <code>apiKey</code>, <code>sheetId</code> e <code>sheet</code> o <code>range</code>.
            <ul class="config-list">
              <li><code>?apiKey=...&amp;sheetId=...&amp;sheet=Invitati</code></li>
              <li><code>?apiKey=...&amp;sheetId=...&amp;range=Invitati!A:Z</code></li>
            </ul>
          </div>
        `;
      }

      function renderLoadError() {
        resultsSection.innerHTML = `
          <div class="state-box">
            <span class="state-icon" aria-hidden="true">⚠️</span>
            <p class="state-title">Impossibile caricare il foglio</p>
            <p class="state-description">
              Verifica API key, spreadsheet ID, nome del foglio o range. Il fetch usa Google Sheets API v4.
            </p>
          </div>
        `;
      }

      /**
       * @param {string} query
       */
      function renderEmpty(query) {
        const safeQuery = escapeHtml(query);
        resultsSection.innerHTML = `
          <div class="state-box">
            <span class="state-icon" aria-hidden="true">🔎</span>
            <p class="state-title">Nessun risultato</p>
            <p class="state-description">
              Nessun invitato corrisponde a <strong>“${safeQuery}”</strong>.
            </p>
          </div>
        `;
      }

      /**
       * @param {Guest[]} guests
       * @param {string} query
       */
      function renderResults(guests, query) {
        hideTableView();

        if (guests.length === 0) {
          renderEmpty(query);
          return;
        }

        resultsSection.replaceChildren();

        const meta = document.createElement("p");
        meta.className = "result-meta";
        meta.textContent = guests.length === 1 ? "1 risultato" : `${guests.length} risultati`;
        resultsSection.appendChild(meta);

        const fragment = document.createDocumentFragment();
        for (const guest of guests) {
          fragment.appendChild(createGuestCard(guest));
        }
        resultsSection.appendChild(fragment);
      }

      /**
       * @param {Guest} guest
       * @returns {HTMLElement}
       */
      function createGuestCard(guest) {
        const article = document.createElement("article");
        article.className = "guest-card";

        const name = document.createElement("span");
        name.className = "guest-name";
        name.textContent = guest.fullName;

        const button = document.createElement("button");
        button.type = "button";
        button.className = "table-badge";
        button.textContent = guest.tableName;
        button.setAttribute("aria-label", `Apri il tavolo ${guest.tableName}`);
        button.addEventListener("click", () => renderTableView(guest.tableName, guest.id));

        article.append(name, button);
        return article;
      }

      /**
       * @param {string} tableName
       * @param {string} highlightedGuestId
       */
      function renderTableView(tableName, highlightedGuestId) {
        const tableGuests = allGuests
          .filter((guest) => guest.tableName === tableName)
          .sort((left, right) => left.fullName.localeCompare(right.fullName, "it"));

        resultsSection.replaceChildren();
        tableViewElement.replaceChildren();

        const backButton = document.createElement("button");
        backButton.type = "button";
        backButton.className = "back-btn";
        backButton.innerHTML = `<span aria-hidden="true">←</span><span>Torna ai risultati</span>`;
        backButton.addEventListener("click", () => {
          const query = searchInput.value.trim();
          if (!query) {
            renderIdle();
            hideTableView();
            return;
          }

          renderResults(filterGuests(query), query);
        });

        const heading = document.createElement("div");
        heading.className = "table-heading";
        heading.innerHTML = `
          <div class="table-heading-icon" aria-hidden="true">🍽️</div>
          <div>
            <p class="table-title">${escapeHtml(tableName)}</p>
            <p class="table-subtitle">${tableGuests.length} commensali a questo tavolo</p>
          </div>
        `;

        const list = document.createElement("ul");
        list.className = "diner-list";

        for (const guest of tableGuests) {
          const item = document.createElement("li");
          item.className = "diner-item";
          if (guest.id === highlightedGuestId) {
            item.classList.add("highlighted");
          }
          item.textContent = guest.fullName;
          list.appendChild(item);
        }

        tableViewElement.append(backButton, heading, list);
        tableViewElement.classList.add("active");
        tableViewElement.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function hideTableView() {
        tableViewElement.classList.remove("active");
        tableViewElement.replaceChildren();
      }

      /**
       * @param {string} query
       * @returns {Guest[]}
       */
      function filterGuests(query) {
        const normalizedQuery = normalizeText(query);
        const terms = normalizedQuery.split(" ").filter(Boolean);

        return allGuests
          .filter((guest) => terms.every((term) => guest.searchText.includes(term)))
          .sort((left, right) => left.fullName.localeCompare(right.fullName, "it"));
      }

      searchInput.addEventListener("input", () => {
        hideTableView();
        const query = searchInput.value.trim();

        if (!query) {
          renderIdle();
          return;
        }

        renderResults(filterGuests(query), query);
      });

      /**
       * @param {string} unsafeText
       * @returns {string}
       */
      function escapeHtml(unsafeText) {
        return unsafeText
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      /**
       * @param {Record<string, string>} source
       * @param {string[]} keys
       * @returns {string | undefined}
       */
      function pickFirstValue(source, keys) {
        for (const key of keys) {
          const value = source[key];
          if (value) {
            return value;
          }
        }

        return undefined;
      }

      /**
       * @param {string} value
       * @returns {string}
       */
      function normalizeHeader(value) {
        return normalizeText(value).replace(/\s+/g, "");
      }

      /**
       * @param {string} value
       * @returns {string}
       */
      function normalizeText(value) {
        return String(value)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s]/gu, " ")
          .replace(/\s+/g, " ")
          .trim();
      }
    </script>
  </body>
</html>
