<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau · Congresso Nazionale Siena 2026</title>
    <meta
      name="description"
      content="Trova il tuo tavolo al Congresso Nazionale Siena 2026."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --color-primary: #d41367;
        --color-primary-dark: #a90f51;
        --color-primary-soft: #fde7f1;
        --color-ink: #1f2937;
        --color-muted: #5f6b7a;
        --color-line: #e5e7eb;
        --color-surface: #ffffff;
        --color-page: #f8f5f7;
        --color-success: #0f766e;
        --shadow-lg: 0 24px 60px rgba(31, 41, 55, 0.12);
        --shadow-md: 0 16px 36px rgba(31, 41, 55, 0.08);
        --radius-xl: 28px;
        --radius-lg: 22px;
        --radius-md: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-family: "Open Sans", system-ui, sans-serif;
        background: var(--color-page);
        color: var(--color-ink);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(212, 19, 103, 0.12), transparent 34%),
          linear-gradient(180deg, #fff 0%, var(--color-page) 100%);
      }

      .shell {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      .hero,
      .panel,
      .result-card,
      .table-card,
      .dialog-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadow-md);
      }

      .hero {
        border-radius: var(--radius-xl);
        padding: 28px 24px;
        margin-bottom: 16px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--color-primary-soft);
        color: var(--color-primary-dark);
        font-size: 0.86rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .hero h1 {
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.05;
      }

      .hero p {
        margin-top: 14px;
        color: var(--color-muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .layout {
        display: grid;
        gap: 16px;
      }

      .panel {
        border-radius: var(--radius-lg);
        padding: 22px 20px;
      }

      .search-label {
        display: block;
        margin-bottom: 10px;
        font-size: 0.94rem;
        font-weight: 700;
      }

      .search-wrap {
        position: relative;
      }

      .search-input {
        width: 100%;
        min-height: 60px;
        padding: 0 18px 0 52px;
        border: 1px solid rgba(212, 19, 103, 0.18);
        border-radius: 18px;
        background: #fff;
        color: var(--color-ink);
        font: inherit;
        font-size: 1rem;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
      }

      .search-input:focus {
        outline: none;
        border-color: rgba(212, 19, 103, 0.55);
        box-shadow: 0 0 0 4px rgba(212, 19, 103, 0.12);
        transform: translateY(-1px);
      }

      .search-icon {
        position: absolute;
        top: 50%;
        left: 18px;
        transform: translateY(-50%);
        font-size: 1.15rem;
      }

      .status {
        margin-top: 14px;
        color: var(--color-muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .status[data-tone="error"] {
        color: var(--color-primary-dark);
      }

      .status[data-tone="success"] {
        color: var(--color-success);
      }

      .results {
        display: grid;
        gap: 14px;
      }

      .result-card,
      .table-card {
        border-radius: var(--radius-md);
        padding: 18px;
      }

      .result-card h3,
      .table-card h3 {
        font-size: 1.05rem;
      }

      .result-meta,
      .table-meta {
        margin-top: 10px;
        color: var(--color-muted);
        line-height: 1.5;
      }

      .table-button,
      .ghost-button,
      .primary-button {
        appearance: none;
        border: none;
        border-radius: 999px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease,
          color 0.2s ease;
      }

      .table-button,
      .primary-button {
        padding: 10px 16px;
        background: var(--color-primary);
        color: #fff;
        box-shadow: 0 10px 20px rgba(212, 19, 103, 0.2);
      }

      .table-button:hover,
      .table-button:focus-visible,
      .primary-button:hover,
      .primary-button:focus-visible {
        background: var(--color-primary-dark);
        transform: translateY(-1px);
      }

      .ghost-button {
        padding: 10px 16px;
        background: transparent;
        color: var(--color-muted);
      }

      .ghost-button:hover,
      .ghost-button:focus-visible {
        background: rgba(31, 41, 55, 0.06);
        color: var(--color-ink);
      }

      .card-actions,
      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .empty-state {
        border: 1px dashed rgba(212, 19, 103, 0.24);
        border-radius: var(--radius-md);
        padding: 20px;
        color: var(--color-muted);
        background: rgba(255, 255, 255, 0.72);
        line-height: 1.6;
      }

      .hint-list,
      .guest-list {
        margin: 12px 0 0;
        padding-left: 18px;
        color: var(--color-muted);
        line-height: 1.6;
      }

      dialog {
        width: min(100%, 560px);
        border: none;
        padding: 0;
        background: transparent;
      }

      dialog::backdrop {
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(4px);
      }

      .dialog-card {
        border-radius: var(--radius-xl);
        padding: 24px;
        box-shadow: var(--shadow-lg);
      }

      .dialog-card header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .dialog-card p {
        margin-top: 10px;
        color: var(--color-muted);
        line-height: 1.6;
      }

      .guest-list {
        display: grid;
        gap: 10px;
        padding: 0;
        list-style: none;
      }

      .guest-list li {
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(212, 19, 103, 0.06);
        color: var(--color-ink);
      }

      .guest-list li strong {
        display: block;
      }

      .guest-list li span {
        display: inline-block;
        margin-top: 4px;
        color: var(--color-muted);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 640px) {
        .shell {
          padding: 14px 12px 28px;
        }

        .hero,
        .panel,
        .dialog-card {
          padding: 20px 18px;
        }

        .search-input {
          min-height: 56px;
          padding-left: 48px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Congresso Nazionale Siena 2026</p>
        <h1 id="page-title">Trova il tuo tavolo</h1>
        <p>
          Inserisci nome e cognome per visualizzare il tuo tavolo e, con un
          tocco, scoprire chi è seduto con te.
        </p>
      </section>

      <div class="layout">
        <section class="panel" aria-labelledby="search-title">
          <h2 id="search-title" class="visually-hidden">Ricerca invitato</h2>
          <label class="search-label" for="guest-search">Nome e cognome</label>
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="guest-search"
              class="search-input"
              type="search"
              inputmode="search"
              autocomplete="name"
              placeholder="Es. Mario Rossi"
            />
          </div>
          <p id="status" class="status" aria-live="polite"></p>
        </section>

        <section class="panel" aria-labelledby="results-title">
          <h2 id="results-title">Risultati</h2>
          <div id="results" class="results" aria-live="polite"></div>
        </section>
      </div>
    </main>

    <dialog id="table-dialog" aria-labelledby="table-dialog-title">
      <article class="dialog-card">
        <header>
          <div>
            <h2 id="table-dialog-title"></h2>
            <p id="table-dialog-description"></p>
          </div>
          <form method="dialog">
            <button type="submit" class="ghost-button" aria-label="Chiudi">
              Chiudi
            </button>
          </form>
        </header>
        <ul id="table-dialog-guests" class="guest-list"></ul>
        <div class="dialog-actions">
          <form method="dialog">
            <button type="submit" class="primary-button">Fatto</button>
          </form>
        </div>
      </article>
    </dialog>

    <script type="module">
      /**
       * @typedef {Object} SpreadsheetConfig
       * @property {string} sheetId
       * @property {string} gid
       * @property {string} sheetName
       * @property {string} csvUrl
       */

      /**
       * @typedef {Object} Guest
       * @property {string} id
       * @property {string} fullName
       * @property {string} firstName
       * @property {string} lastName
       * @property {string} tableName
       * @property {string} searchText
       * @property {Record<string, string>} source
       */

      /** @type {SpreadsheetConfig} */
      const DEFAULT_CONFIG = {
        sheetId: "",
        gid: "",
        sheetName: "",
        csvUrl: "",
      };

      /** @type {HTMLInputElement} */
      const searchInput = document.querySelector("#guest-search");
      /** @type {HTMLParagraphElement} */
      const status = document.querySelector("#status");
      /** @type {HTMLDivElement} */
      const resultsContainer = document.querySelector("#results");
      /** @type {HTMLDialogElement} */
      const tableDialog = document.querySelector("#table-dialog");
      /** @type {HTMLHeadingElement} */
      const tableDialogTitle = document.querySelector("#table-dialog-title");
      /** @type {HTMLParagraphElement} */
      const tableDialogDescription = document.querySelector("#table-dialog-description");
      /** @type {HTMLUListElement} */
      const tableDialogGuests = document.querySelector("#table-dialog-guests");

      /** @type {Guest[]} */
      let guests = [];
      /** @type {Guest[]} */
      let filteredGuests = [];
      initialize().catch((error) => {
        console.error(error);
        setStatus("Non è stato possibile caricare i dati dal Google Spreadsheet.", "error");
        renderErrorState(
          "Verifica che il foglio sia pubblico e che i parametri `sheetId`, `gid`, `sheet` o `csvUrl` siano corretti.",
        );
      });

      async function initialize() {
        searchInput.disabled = true;
        setStatus("Caricamento invitati in corso…");
        renderLoadingState();

        const config = getSpreadsheetConfig();
        if (!hasSpreadsheetSource(config)) {
          setStatus(
            "Configura il collegamento al Google Spreadsheet per iniziare.",
            "error",
          );
          renderConfigurationHelp();
          return;
        }

        guests = await fetchGuests(config);
        filteredGuests = guests;
        searchInput.disabled = false;
        searchInput.addEventListener("input", handleSearchInput);

        if (guests.length === 0) {
          setStatus("Nessun invitato disponibile nel foglio.", "error");
          renderEmptyState(
            "Il foglio è stato letto correttamente ma non contiene record validi.",
          );
          return;
        }

        setStatus(
          `${guests.length} invitati caricati. Inizia a digitare per cercare il tuo nominativo.`,
          "success",
        );
        renderResults(guests);
      }

      /**
       * @returns {SpreadsheetConfig}
       */
      function getSpreadsheetConfig() {
        const params = new URLSearchParams(window.location.search);
        return {
          sheetId: params.get("sheetId")?.trim() ?? DEFAULT_CONFIG.sheetId,
          gid: params.get("gid")?.trim() ?? DEFAULT_CONFIG.gid,
          sheetName: params.get("sheet")?.trim() ?? DEFAULT_CONFIG.sheetName,
          csvUrl: params.get("csvUrl")?.trim() ?? DEFAULT_CONFIG.csvUrl,
        };
      }

      /**
       * @param {SpreadsheetConfig} config
       * @returns {boolean}
       */
      function hasSpreadsheetSource(config) {
        return Boolean(config.csvUrl || config.sheetId);
      }

      /**
       * @param {SpreadsheetConfig} config
       * @returns {Promise<Guest[]>}
       */
      async function fetchGuests(config) {
        const response = await fetch(buildSpreadsheetUrl(config), {
          headers: {
            Accept: "text/csv, text/plain, */*",
          },
        });

        if (!response.ok) {
          throw new Error(`Spreadsheet request failed with status ${response.status}`);
        }

        const csvText = await response.text();
        const rows = parseCsv(csvText);
        return normalizeGuests(rows);
      }

      /**
       * @param {SpreadsheetConfig} config
       * @returns {string}
       */
      function buildSpreadsheetUrl(config) {
        if (config.csvUrl) {
          return config.csvUrl;
        }

        const url = new URL(
          `https://docs.google.com/spreadsheets/d/${encodeURIComponent(config.sheetId)}/gviz/tq`,
        );
        url.searchParams.set("tqx", "out:csv");

        if (config.gid) {
          url.searchParams.set("gid", config.gid);
        }

        if (config.sheetName) {
          url.searchParams.set("sheet", config.sheetName);
        }

        return url.toString();
      }

      /**
       * @param {InputEvent} event
       */
      function handleSearchInput(event) {
        const value = String(event.target?.value ?? "");
        const query = normalizeText(value);

        if (!query) {
          filteredGuests = guests;
          setStatus(
            `${guests.length} invitati caricati. Inizia a digitare per cercare il tuo nominativo.`,
            "success",
          );
          renderResults(filteredGuests);
          return;
        }

        filteredGuests = guests
          .filter((guest) => guest.searchText.includes(query))
          .sort((left, right) => left.fullName.localeCompare(right.fullName, "it"));

        if (filteredGuests.length === 0) {
          setStatus("Nessun risultato trovato. Prova con meno lettere o senza accenti.");
          renderEmptyState("Non risultano invitati che corrispondono alla ricerca.");
          return;
        }

        setStatus(
          filteredGuests.length === 1
            ? "1 risultato trovato."
            : `${filteredGuests.length} risultati trovati.`,
          "success",
        );
        renderResults(filteredGuests);
      }

      /**
       * @param {Guest[]} items
       */
      function renderResults(items) {
        resultsContainer.replaceChildren();

        if (items.length === 0) {
          renderEmptyState("Nessun invitato da visualizzare.");
          return;
        }

        const fragment = document.createDocumentFragment();
        for (const guest of items) {
          fragment.appendChild(createResultCard(guest));
        }

        resultsContainer.appendChild(fragment);
      }

      /**
       * @param {Guest} guest
       * @returns {HTMLElement}
       */
      function createResultCard(guest) {
        const article = document.createElement("article");
        article.className = "result-card";

        const title = document.createElement("h3");
        title.textContent = guest.fullName;

        const meta = document.createElement("p");
        meta.className = "result-meta";
        meta.textContent = "Tavolo assegnato";

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const tableButton = document.createElement("button");
        tableButton.type = "button";
        tableButton.className = "table-button";
        tableButton.textContent = guest.tableName;
        tableButton.addEventListener("click", () => openTableDialog(guest.tableName, guest.id));

        actions.appendChild(tableButton);
        article.append(title, meta, actions);
        return article;
      }

      function renderLoadingState() {
        renderEmptyState("Sto recuperando i nominativi dal Google Spreadsheet…");
      }

      /**
       * @param {string} message
       */
      function renderEmptyState(message) {
        resultsContainer.replaceChildren();
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = message;
        resultsContainer.appendChild(empty);
      }

      function renderConfigurationHelp() {
        resultsContainer.replaceChildren();

        const container = document.createElement("div");
        container.className = "empty-state";

        const title = document.createElement("strong");
        title.textContent = "Configurazione Google Spreadsheet mancante";

        const description = document.createElement("p");
        description.className = "result-meta";
        description.textContent =
          "Passa il foglio tramite query string oppure valorizza le costanti iniziali nel file HTML.";

        const hintList = document.createElement("ul");
        hintList.className = "hint-list";
        hintList.innerHTML = [
          "<li><code>?sheetId=SPREADSHEET_ID&amp;gid=0</code></li>",
          "<li><code>?sheetId=SPREADSHEET_ID&amp;sheet=Invitati</code></li>",
          "<li><code>?csvUrl=https://...</code></li>",
        ].join("");

        container.append(title, description, hintList);
        resultsContainer.appendChild(container);
      }

      /**
       * @param {string} message
       */
      function renderErrorState(message) {
        resultsContainer.replaceChildren();
        const container = document.createElement("div");
        container.className = "empty-state";
        container.textContent = message;
        resultsContainer.appendChild(container);
      }

      /**
       * @param {string} tableName
       * @param {string} selectedGuestId
       */
      function openTableDialog(tableName, selectedGuestId) {
        const tableGuests = guests
          .filter((guest) => guest.tableName === tableName)
          .sort((left, right) => left.fullName.localeCompare(right.fullName, "it"));

        tableDialogTitle.textContent = tableName;
        tableDialogDescription.textContent =
          tableGuests.length === 1
            ? "Al momento risulta una sola persona associata a questo tavolo."
            : `${tableGuests.length} persone risultano assegnate a questo tavolo.`;

        tableDialogGuests.replaceChildren(
          ...tableGuests.map((guest) => {
            const item = document.createElement("li");
            const name = document.createElement("strong");
            name.textContent = guest.fullName;

            const detail = document.createElement("span");
            detail.textContent =
              guest.id === selectedGuestId ? "Sei qui" : "Commensale del tuo tavolo";

            item.append(name, detail);
            return item;
          }),
        );

        if (!tableDialog.open) {
          tableDialog.showModal();
        }
      }

      /**
       * @param {string} message
       * @param {"default" | "error" | "success"} [tone]
       */
      function setStatus(message, tone = "default") {
        status.textContent = message;
        status.dataset.tone = tone;
      }

      /**
       * @param {string} csvText
       * @returns {Array<Record<string, string>>}
       */
      function parseCsv(csvText) {
        /** @type {string[][]} */
        const rows = [];
        /** @type {string[]} */
        let currentRow = [];
        let currentValue = "";
        let isQuoted = false;

        for (let charIndex = 0; charIndex < csvText.length; charIndex += 1) {
          const char = csvText[charIndex];
          const nextChar = csvText[charIndex + 1];

          if (char === '"') {
            if (isQuoted && nextChar === '"') {
              currentValue += '"';
              charIndex += 1;
              continue;
            }

            isQuoted = !isQuoted;
            continue;
          }

          if (char === "," && !isQuoted) {
            currentRow.push(currentValue.trim());
            currentValue = "";
            continue;
          }

          if ((char === "\n" || char === "\r") && !isQuoted) {
            if (char === "\r" && nextChar === "\n") {
              charIndex += 1;
            }

            currentRow.push(currentValue.trim());
            if (hasNonEmptyValue(currentRow)) {
              rows.push(currentRow);
            }
            currentRow = [];
            currentValue = "";
            continue;
          }

          currentValue += char;
        }

        if (currentValue.length > 0 || currentRow.length > 0) {
          currentRow.push(currentValue.trim());
          if (hasNonEmptyValue(currentRow)) {
            rows.push(currentRow);
          }
        }

        if (rows.length === 0) {
          return [];
        }

        const [headers, ...dataRows] = rows;
        return dataRows.map((record) => {
          /** @type {Record<string, string>} */
          const entry = {};
          headers.forEach((header, headerIndex) => {
            entry[header] = record[headerIndex]?.trim() ?? "";
          });
          return entry;
        });
      }

      /**
       * @param {string[]} row
       * @returns {boolean}
       */
      function hasNonEmptyValue(row) {
        return row.some((value) => value.length > 0);
      }

      /**
       * @param {Array<Record<string, string>>} rows
       * @returns {Guest[]}
       */
      function normalizeGuests(rows) {
        return rows
          .map((row, index) => {
            const normalizedRow = Object.fromEntries(
              Object.entries(row).map(([key, value]) => [normalizeHeader(key), String(value).trim()]),
            );

            const firstName =
              pickFirstValue(normalizedRow, ["nome", "firstname", "first", "givenname"]) ?? "";
            const lastName =
              pickFirstValue(normalizedRow, ["cognome", "lastname", "last", "surname"]) ?? "";
            const combinedName =
              pickFirstValue(normalizedRow, [
                "nomecognome",
                "nomeecognome",
                "fullname",
                "nominativo",
                "guest",
                "ospite",
                "partecipante",
              ]) ?? "";
            const tableName =
              pickFirstValue(normalizedRow, [
                "tavolo",
                "tableau",
                "table",
                "tablename",
                "nometavolo",
                "tavoloassegnato",
              ]) ?? "";

            const fullName = combinedName || [firstName, lastName].filter(Boolean).join(" ").trim();
            if (!fullName || !tableName) {
              return null;
            }

            return {
              id: `${index}-${normalizeText(fullName)}-${normalizeText(tableName)}`,
              fullName,
              firstName,
              lastName,
              tableName,
              searchText: normalizeText(fullName),
              source: Object.fromEntries(
                Object.entries(row).map(([key, value]) => [key, String(value).trim()]),
              ),
            };
          })
          .filter((guest) => guest !== null);
      }

      /**
       * @param {Record<string, string>} source
       * @param {string[]} keys
       * @returns {string | undefined}
       */
      function pickFirstValue(source, keys) {
        for (const key of keys) {
          const value = source[key];
          if (value) {
            return value;
          }
        }

        return undefined;
      }

      /**
       * @param {string} value
       * @returns {string}
       */
      function normalizeHeader(value) {
        return normalizeText(value).replace(/\s+/g, "");
      }

      /**
       * @param {string} value
       * @returns {string}
       */
      function normalizeText(value) {
        return String(value)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s]/gu, " ")
          .replace(/\s+/g, " ")
          .trim();
      }
    </script>
  </body>
</html>
