<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Il mio tavolo – Congresso Nazionale Siena 2026</title>
    <meta
      name="description"
      content="Trova il tuo tavolo al Congresso Nazionale Siena 2026."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cranberry: #d41367;
        --cranberry-light: #f9d0e5;
        --cranberry-dark: #a50f50;
        --text: #1a1a2e;
        --text-secondary: #5a5a72;
        --bg: #f7f7fa;
        --card-bg: #ffffff;
        --border: #e2e2ee;
        --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.06);
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        --radius: 14px;
        --radius-sm: 8px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e8e8f4;
          --text-secondary: #9090aa;
          --bg: #0e0e1c;
          --card-bg: #181828;
          --border: #2a2a40;
        }
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Open Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      header {
        background: var(--cranberry);
        color: #fff;
        text-align: center;
        padding: 2.25rem 1.5rem 2rem;
      }

      header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 0.35rem;
      }

      header p {
        font-size: 0.95rem;
        font-weight: 300;
        opacity: 0.88;
      }

      main {
        flex: 1;
        max-width: 640px;
        width: 100%;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }

      .search-section {
        margin-bottom: 1.75rem;
      }

      .search-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-secondary);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 0.6rem;
      }

      .search-wrapper {
        position: relative;
      }

      .search-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--cranberry);
        pointer-events: none;
        display: flex;
      }

      .search-input {
        width: 100%;
        padding: 0.9rem 1rem 0.9rem 3rem;
        font-family: inherit;
        font-size: 1rem;
        border: 2px solid var(--border);
        border-radius: var(--radius);
        background: var(--card-bg);
        color: var(--text);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .search-input:focus {
        border-color: var(--cranberry);
        box-shadow: 0 0 0 4px rgba(212, 19, 103, 0.12);
      }

      .search-input::placeholder {
        color: #aaaacc;
      }

      .result-meta {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--text-secondary);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 0.85rem;
      }

      .guest-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.1rem 1.4rem;
        margin-bottom: 0.65rem;
        box-shadow: var(--shadow-sm);
        transition: transform 0.15s, box-shadow 0.15s;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .guest-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      .guest-name {
        font-size: 1rem;
        font-weight: 600;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .table-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background: var(--cranberry-light);
        color: var(--cranberry-dark);
        font-family: inherit;
        font-size: 0.83rem;
        font-weight: 700;
        padding: 0.55rem 0.9rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s, color 0.15s;
      }

      .table-badge-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.08rem;
        text-align: left;
      }

      .table-badge-label {
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.8;
      }

      .table-badge-name {
        font-size: 0.92rem;
        line-height: 1.1;
      }

      .table-badge-icon {
        font-size: 1rem;
        line-height: 1;
      }

      .table-badge:hover,
      .table-badge:focus-visible {
        background: var(--cranberry);
        color: #fff;
        outline: none;
      }

      .table-view {
        display: none;
      }

      .table-view.active {
        display: block;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        background: none;
        border: none;
        color: var(--cranberry);
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 0.4rem 0;
        margin-bottom: 1.5rem;
      }

      .back-btn:hover,
      .back-btn:focus-visible {
        opacity: 0.7;
        outline: none;
      }

      .table-heading {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1.4rem;
      }

      .table-heading-icon {
        width: 40px;
        height: 40px;
        background: var(--cranberry);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        flex-shrink: 0;
      }

      .table-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--cranberry);
      }

      .table-subtitle {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 0.1rem;
      }

      .diner-list {
        list-style: none;
      }

      .diner-item {
        padding: 0.75rem 1.2rem;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: 0.45rem;
        font-size: 0.95rem;
        box-shadow: var(--shadow-sm);
      }

      .diner-item.highlighted {
        border-color: var(--cranberry-dark);
        background: var(--cranberry-dark);
        color: #fff;
        font-weight: 700;
      }

      .state-box {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-secondary);
      }

      .state-icon {
        font-size: 2.6rem;
        margin-bottom: 1rem;
        display: block;
      }

      .state-title {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        color: var(--text);
      }

      .state-description {
        font-size: 0.875rem;
        line-height: 1.65;
      }

      .loader {
        text-align: center;
        padding: 3rem;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--cranberry-light);
        border-top-color: var(--cranberry);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        margin: 0 auto 1rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loader-text {
        font-size: 0.88rem;
        color: var(--text-secondary);
      }

      .config-notice {
        background: #fffbee;
        border: 1px solid #ffe082;
        border-radius: var(--radius);
        padding: 1.25rem 1.5rem;
        font-size: 0.875rem;
        line-height: 1.7;
        color: #6b5300;
      }

      .config-notice strong {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 1rem;
      }

      .config-notice code {
        font-family: "Courier New", monospace;
        font-size: 0.82em;
        background: rgba(0, 0, 0, 0.07);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }

      .config-list {
        margin-top: 0.75rem;
        padding-left: 1.1rem;
      }

      .config-list li + li {
        margin-top: 0.35rem;
      }

      .config-copy {
        margin-top: 0.35rem;
      }

      footer {
        text-align: center;
        padding: 1.25rem;
        font-size: 0.72rem;
        color: var(--text-secondary);
        letter-spacing: 0.04em;
      }

      @media (max-width: 520px) {
        .guest-card {
          align-items: flex-start;
          flex-direction: column;
        }

        .table-badge {
          align-self: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Congresso Nazionale Siena 2026</h1>
      <p>Trova il tuo posto a tavola</p>
    </header>

    <main>
      <section class="search-section" aria-label="Ricerca commensale">
        <label for="search-input" class="search-label">Cerca il tuo nome</label>
        <div class="search-wrapper">
          <span class="search-icon" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Nome e cognome…"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Cerca il tuo nome"
          />
        </div>
      </section>

      <section
        id="results-section"
        aria-live="polite"
        aria-atomic="false"
        aria-label="Risultati ricerca"
      ></section>

      <section
        id="table-view"
        class="table-view"
        aria-label="Commensali al tavolo"
        aria-live="polite"
      ></section>

      <template id="loader-template">
        <div class="loader" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <p class="loader-text"></p>
        </div>
      </template>

      <template id="state-box-template">
        <div class="state-box">
          <span class="state-icon" aria-hidden="true"></span>
          <p class="state-title"></p>
          <p class="state-description"></p>
        </div>
      </template>

      <template id="config-notice-template">
        <div class="config-notice">
          <strong class="config-title"></strong>
          <p class="config-copy"></p>
          <ul class="config-list">
            <li><code class="config-example"></code></li>
            <li><code class="config-example"></code></li>
          </ul>
        </div>
      </template>

      <template id="guest-card-template">
        <article class="guest-card">
          <span class="guest-name"></span>
          <button type="button" class="table-badge">
            <span class="table-badge-text">
              <span class="table-badge-label">Apri tavolo</span>
              <span class="table-badge-name"></span>
            </span>
            <span class="table-badge-icon" aria-hidden="true">→</span>
          </button>
        </article>
      </template>

      <template id="table-view-template">
        <div>
          <button type="button" class="back-btn">
            <span aria-hidden="true">←</span>
            <span class="back-btn-label">Torna ai risultati</span>
          </button>

          <div class="table-heading">
            <div class="table-heading-icon" aria-hidden="true">🍽️</div>
            <div>
              <p class="table-title"></p>
              <p class="table-subtitle"></p>
            </div>
          </div>

          <ul class="diner-list"></ul>
        </div>
      </template>
    </main>

    <footer>
      <p>Distretto Rotaract 2071 &mdash; Congresso Nazionale Siena 2026</p>
    </footer>

    <script type="module">
      /**
       * @typedef {Object} SheetsConfig
       * @property {string} apiKey
       * @property {string} spreadsheetId
       * @property {string} sheetName
       * @property {string} range
       */

      /**
       * @typedef {Object} Guest
       * @property {string} id
       * @property {string} fullName
       * @property {string} firstName
       * @property {string} lastName
       * @property {string} tableName
       * @property {string} searchText
       * @property {Record<string, string>} source
       */

      /** @type {SheetsConfig} */
      const DEFAULT_SHEETS_CONFIG = {
        apiKey: "AIzaSyDIhVpU699cqvGJHdLzMKLvqCkLHS9qrr8",
        spreadsheetId: "13xXTsIBdaxMiSXysw-9TE4vk2HsCh3bjv0yh2ghf6OU",
        sheetName: "Tableau",
        range: "",
      };

      /** @type {Guest[]} */
      let allGuests = [];

      const resultsSection = /** @type {HTMLElement} */ (document.getElementById("results-section"));
      const tableViewElement = /** @type {HTMLElement} */ (document.getElementById("table-view"));
      const searchInput = /** @type {HTMLInputElement} */ (document.getElementById("search-input"));
      const loaderTemplate = /** @type {HTMLTemplateElement} */ (document.getElementById("loader-template"));
      const stateBoxTemplate = /** @type {HTMLTemplateElement} */ (document.getElementById("state-box-template"));
      const configNoticeTemplate = /** @type {HTMLTemplateElement} */ (document.getElementById("config-notice-template"));
      const guestCardTemplate = /** @type {HTMLTemplateElement} */ (document.getElementById("guest-card-template"));
      const tableViewTemplate = /** @type {HTMLTemplateElement} */ (document.getElementById("table-view-template"));

      initialize().catch((error) => {
        console.error(error);
        const message = error instanceof Error ? error.message : "Errore sconosciuto";
        renderLoadError(message);
      });

      async function initialize() {
        const config = getSheetsConfig();

        if (!hasSheetsConfig(config)) {
          searchInput.disabled = true;
          renderConfigNotice();
          hideTableView();
          return;
        }

        searchInput.disabled = true;
        renderLoader();
        hideTableView();

        const values = await fetchSheetValues(config);
        allGuests = normalizeGuests(values);
        searchInput.disabled = false;

        if (allGuests.length === 0) {
          renderNoData();
          return;
        }

        renderIdle();
      }

      /**
       * @returns {SheetsConfig}
       */
      function getSheetsConfig() {
        const params = new URLSearchParams(window.location.search);

        return {
          apiKey: params.get("apiKey")?.trim() ?? DEFAULT_SHEETS_CONFIG.apiKey,
          spreadsheetId:
            params.get("sheetId")?.trim() ?? DEFAULT_SHEETS_CONFIG.spreadsheetId,
          sheetName: params.get("sheet")?.trim() ?? DEFAULT_SHEETS_CONFIG.sheetName,
          range: params.get("range")?.trim() ?? DEFAULT_SHEETS_CONFIG.range,
        };
      }

      /**
       * @param {SheetsConfig} config
       * @returns {boolean}
       */
      function hasSheetsConfig(config) {
        return Boolean(config.apiKey && config.spreadsheetId && (config.range || config.sheetName));
      }

      /**
       * @param {SheetsConfig} config
       * @returns {Promise<string[][]>}
       */
      async function fetchSheetValues(config) {
        const range = config.range || config.sheetName;
        const encodedRange = encodeURIComponent(range);
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${config.spreadsheetId}/values/${encodedRange}?key=${config.apiKey}`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            `Google Sheets API request failed with status ${response.status} ${response.statusText}. Verifica API key, permessi del foglio e range richiesto.`,
          );
        }

        /** @type {{ values?: string[][], error?: { message?: string } }} */
        const data = await response.json();

        if (data.error?.message) {
          throw new Error(data.error.message);
        }

        return Array.isArray(data.values) ? data.values : [];
      }

      /**
       * @param {string[][]} values
       * @returns {Guest[]}
       */
      function normalizeGuests(values) {
        if (values.length === 0) {
          return [];
        }

        const [headers, ...dataRows] = values;

        return dataRows
          .map((rowValues, rowIndex) => {
            /** @type {Record<string, string>} */
            const rawRow = {};

            headers.forEach((header, headerIndex) => {
              rawRow[String(header ?? "").trim()] = String(rowValues[headerIndex] ?? "").trim();
            });

            const normalizedRow = Object.fromEntries(
              Object.entries(rawRow).map(([key, value]) => [normalizeHeader(key), value]),
            );

            const firstName =
              pickFirstValue(normalizedRow, ["nome", "firstname", "first", "givenname"]) ?? "";
            const lastName =
              pickFirstValue(normalizedRow, ["cognome", "lastname", "last", "surname"]) ?? "";
            const combinedName =
              pickFirstValue(normalizedRow, [
                "nomecognome",
                "nomeecognome",
                "fullname",
                "nomecompleto",
                "nominativo",
                "name",
                "guest",
                "ospite",
                "partecipante",
              ]) ?? "";
            const tableName =
              pickFirstValue(normalizedRow, [
                "tavolo",
                "table",
                "tableau",
                "tablename",
                "nometavolo",
                "tavoloassegnato",
                "table_name",
              ]) ?? "";

            const fullName = combinedName || [firstName, lastName].filter(Boolean).join(" ").trim();
            if (!fullName || !tableName) {
              return null;
            }

            return {
              id: `${rowIndex}-${normalizeText(fullName)}-${normalizeText(tableName)}`,
              fullName,
              firstName,
              lastName,
              tableName,
              searchText: normalizeText(fullName),
              source: rawRow,
            };
          })
          .filter((guest) => guest !== null);
      }

      function renderLoader() {
        const loaderElement = cloneTemplateElement(loaderTemplate);
        const loaderText = /** @type {HTMLParagraphElement} */ (loaderElement.querySelector(".loader-text"));
        loaderText.textContent = "Sto recuperando i dati dei tavoli…";
        resultsSection.replaceChildren(loaderElement);
      }

      function renderIdle() {
        resultsSection.replaceChildren(
          createStateBox(
            "🍽️",
            "Inserisci nome e cognome",
            "Inizia a digitare per trovare rapidamente il tuo tavolo e vedere con chi sei seduto.",
          ),
        );
      }

      function renderNoData() {
        resultsSection.replaceChildren(
          createStateBox(
            "📭",
            "Nessun invitato disponibile",
            "Il foglio è stato letto correttamente, ma non contiene righe valide con nominativo e tavolo.",
          ),
        );
      }

      function renderConfigNotice() {
        const notice = cloneTemplateElement(configNoticeTemplate);
        const title = /** @type {HTMLElement} */ (notice.querySelector(".config-title"));
        const copy = /** @type {HTMLParagraphElement} */ (notice.querySelector(".config-copy"));
        const examples = notice.querySelectorAll(".config-example");
        title.textContent = "Configurazione Google Sheets mancante";
        copy.replaceChildren(
          "Inserisci nel file HTML oppure nella query string i valori per ",
          createCodeElement("apiKey"),
          ", ",
          createCodeElement("sheetId"),
          " e ",
          createCodeElement("sheet"),
          " o ",
          createCodeElement("range"),
          ".",
        );
        examples[0].textContent = "?apiKey=...&sheetId=...&sheet=Invitati";
        examples[1].textContent = "?apiKey=...&sheetId=...&range=Invitati!A:Z";
        resultsSection.replaceChildren(notice);
      }

      /**
       * @param {string} message
       */
      function renderLoadError(message) {
        resultsSection.replaceChildren(
          createStateBox("⚠️", "Impossibile caricare il foglio", message),
        );
      }

      /**
       * @param {string} query
       */
      function renderEmpty(query) {
        resultsSection.replaceChildren(
          createStateBox("🔎", "Nessun risultato", `Nessun invitato corrisponde a “${query}”.`),
        );
      }

      /**
       * @param {Guest[]} guests
       * @param {string} query
       */
      function renderResults(guests, query) {
        hideTableView();

        if (guests.length === 0) {
          renderEmpty(query);
          return;
        }

        resultsSection.replaceChildren();

        const meta = document.createElement("p");
        meta.className = "result-meta";
        meta.textContent = guests.length === 1 ? "1 risultato" : `${guests.length} risultati`;
        resultsSection.appendChild(meta);

        const fragment = document.createDocumentFragment();
        for (const guest of guests) {
          fragment.appendChild(createGuestCard(guest));
        }
        resultsSection.appendChild(fragment);
      }

      /**
       * @param {Guest} guest
       * @returns {HTMLElement}
       */
      function createGuestCard(guest) {
        const article = cloneTemplateElement(guestCardTemplate);
        const name = /** @type {HTMLSpanElement} */ (article.querySelector(".guest-name"));
        const tableName = /** @type {HTMLSpanElement} */ (article.querySelector(".table-badge-name"));
        const button = /** @type {HTMLButtonElement} */ (article.querySelector(".table-badge"));
        name.textContent = guest.fullName;
        tableName.textContent = guest.tableName;
        button.setAttribute("aria-label", `Apri il tavolo ${guest.tableName}`);
        button.addEventListener("click", () => renderTableView(guest.tableName, guest.id));
        return article;
      }

      /**
       * @param {string} tableName
       * @param {string} highlightedGuestId
       */
      function renderTableView(tableName, highlightedGuestId) {
        const tableGuests = allGuests
          .filter((guest) => guest.tableName === tableName)
          .sort((left, right) => left.fullName.localeCompare(right.fullName, "it"));

        resultsSection.replaceChildren();
        tableViewElement.replaceChildren();

        const viewElement = cloneTemplateElement(tableViewTemplate);
        const backButton = /** @type {HTMLButtonElement} */ (viewElement.querySelector(".back-btn"));
        const title = /** @type {HTMLParagraphElement} */ (viewElement.querySelector(".table-title"));
        const subtitle = /** @type {HTMLParagraphElement} */ (viewElement.querySelector(".table-subtitle"));
        const list = /** @type {HTMLUListElement} */ (viewElement.querySelector(".diner-list"));
        backButton.addEventListener("click", () => {
          const query = searchInput.value.trim();
          if (!query) {
            renderIdle();
            hideTableView();
            return;
          }

          renderResults(filterGuests(query), query);
        });

        title.textContent = tableName;
        subtitle.textContent = `${tableGuests.length} commensali a questo tavolo`;

        for (const guest of tableGuests) {
          const item = document.createElement("li");
          item.className = "diner-item";
          if (guest.id === highlightedGuestId) {
            item.classList.add("highlighted");
          }
          item.textContent = guest.fullName;
          list.appendChild(item);
        }

        tableViewElement.appendChild(viewElement);
        tableViewElement.classList.add("active");
        tableViewElement.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function hideTableView() {
        tableViewElement.classList.remove("active");
        tableViewElement.replaceChildren();
      }

      /**
       * @param {string} query
       * @returns {Guest[]}
       */
      function filterGuests(query) {
        const normalizedQuery = normalizeText(query);
        const terms = normalizedQuery.split(" ").filter(Boolean);

        return allGuests
          .filter((guest) => terms.every((term) => guest.searchText.includes(term)))
          .sort((left, right) => left.fullName.localeCompare(right.fullName, "it"));
      }

      searchInput.addEventListener("input", () => {
        hideTableView();
        const query = searchInput.value.trim();

        if (!query) {
          renderIdle();
          return;
        }

        renderResults(filterGuests(query), query);
      });

      /**
       * @param {string} icon
       * @param {string} title
       * @param {string} description
       * @returns {HTMLElement}
       */
      function createStateBox(icon, title, description) {
        const element = cloneTemplateElement(stateBoxTemplate);
        const iconElement = /** @type {HTMLSpanElement} */ (element.querySelector(".state-icon"));
        const titleElement = /** @type {HTMLParagraphElement} */ (element.querySelector(".state-title"));
        const descriptionElement = /** @type {HTMLParagraphElement} */ (element.querySelector(".state-description"));

        iconElement.textContent = icon;
        titleElement.textContent = title;
        descriptionElement.textContent = description;

        return element;
      }

      /**
       * @param {HTMLTemplateElement} template
       * @returns {HTMLElement}
       */
      function cloneTemplateElement(template) {
        const element = template.content.firstElementChild?.cloneNode(true);
        if (!(element instanceof HTMLElement)) {
          throw new Error(`Template element missing or invalid: ${template.id || "unknown-template"}`);
        }

        return element;
      }

      /**
       * @param {string} value
       * @returns {HTMLElement}
       */
      function createCodeElement(value) {
        const element = document.createElement("code");
        element.textContent = value;
        return element;
      }

      /**
       * @param {Record<string, string>} source
       * @param {string[]} keys
       * @returns {string | undefined}
       */
      function pickFirstValue(source, keys) {
        for (const key of keys) {
          const value = source[key];
          if (value) {
            return value;
          }
        }

        return undefined;
      }

      /**
       * @param {string} value
       * @returns {string}
       */
      function normalizeHeader(value) {
        return normalizeText(value).replace(/\s+/g, "");
      }

      /**
       * @param {string} value
       * @returns {string}
       */
      function normalizeText(value) {
        return String(value)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^\p{L}\p{N}\s]/gu, " ")
          .replace(/\s+/g, " ")
          .trim();
      }
    </script>
  </body>
</html>
