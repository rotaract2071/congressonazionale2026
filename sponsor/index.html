<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sponsor – Congresso Nazionale Siena 2026</title>
    <meta
      name="description"
      content="Scopri gli sponsor che hanno supportato il Congresso Nazionale Siena 2026."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cranberry: #d41367;
        --cranberry-soft: #fdf1f7;
        --cranberry-deep: #a50f50;
        --text: #1d1d2f;
        --text-secondary: #67677c;
        --background: #fcfbfd;
        --surface: #ffffff;
        --border: rgba(212, 19, 103, 0.12);
        --shadow: 0 18px 40px rgba(29, 29, 47, 0.08);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 16px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Open Sans", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(212, 19, 103, 0.08), transparent 34%),
          linear-gradient(180deg, #fff 0%, var(--background) 100%);
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 32rem);
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }

      .hero {
        background: linear-gradient(145deg, var(--cranberry) 0%, var(--cranberry-deep) 100%);
        color: #fff;
        border-radius: var(--radius-xl);
        padding: 1.5rem;
        box-shadow: var(--shadow);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.9rem 0 0.65rem;
        font-size: 1.85rem;
        line-height: 1.15;
      }

      .hero p {
        margin: 0;
        font-size: 0.98rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.88);
      }

      .content {
        margin-top: 1.25rem;
        display: grid;
        gap: 1.1rem;
      }

      .tier-section {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: var(--radius-xl);
        padding: 1.2rem;
        box-shadow: var(--shadow);
      }

      .tier-section p {
        margin: 0 0 1rem;
        font-size: 0.95rem;
        line-height: 1.7;
        color: var(--text-secondary);
      }

      .logo-grid {
        display: grid;
        gap: 0.85rem;
      }

      .logo-grid[data-columns="1"] {
        grid-template-columns: minmax(0, 1fr);
      }

      .logo-grid[data-columns="2"] {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .logo-grid[data-columns="3"] {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .logo-card {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 5.8rem;
        padding: 0.9rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
      }

      .logo-grid[data-columns="1"] .logo-card {
        min-height: 8rem;
        padding: 1.25rem;
      }

      .logo-grid[data-columns="2"] .logo-card {
        aspect-ratio: 1 / 1;
      }

      .logo-grid[data-columns="3"] .logo-card {
        aspect-ratio: 1 / 1;
        padding: 0.65rem;
        border-radius: var(--radius-md);
      }

      .logo-card img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 100%;
        object-fit: contain;
        mix-blend-mode: multiply;
      }

      footer {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.74rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <span class="eyebrow">Congresso Nazionale Siena 2026</span>
        <h1>I nostri sponsor</h1>
        <p>
          Grazie alle realtà che accompagnano l’esperienza del congresso con il
          loro contributo.
        </p>
      </header>

      <div id="app" class="content"></div>

      <footer>Rotaract Distretto 2071</footer>
    </main>

    <script type="module">
      /**
       * @typedef {Object} Sponsor
       * @property {string} alt
       * @property {string} src
       */

      /**
       * @typedef {Object} SponsorTier
       * @property {string} copy
       * @property {number} columns
       * @property {Sponsor[]} sponsors
       */

      /** @type {SponsorTier[]} */
      const tiers = [
        {
          copy: "ringraziamo queste realtà per lo straordinario supporto:",
          columns: 1,
          sponsors: [
            {
              alt: "Logo sponsor principale 1",
              src: "https://placehold.co/1200x600/ffffff/d41367?text=Sponsor+A+1",
            },
            {
              alt: "Logo sponsor principale 2",
              src: "https://placehold.co/1200x600/ffffff/d41367?text=Sponsor+A+2",
            },
          ],
        },
        {
          copy: "ringraziamo queste realtà per il supporto:",
          columns: 2,
          sponsors: [
            {
              alt: "Logo sponsor supporto 1",
              src: "https://placehold.co/800x800/ffffff/d41367?text=Sponsor+B+1",
            },
            {
              alt: "Logo sponsor supporto 2",
              src: "https://placehold.co/800x800/ffffff/d41367?text=Sponsor+B+2",
            },
            {
              alt: "Logo sponsor supporto 3",
              src: "https://placehold.co/800x800/ffffff/d41367?text=Sponsor+B+3",
            },
            {
              alt: "Logo sponsor supporto 4",
              src: "https://placehold.co/800x800/ffffff/d41367?text=Sponsor+B+4",
            },
          ],
        },
        {
          copy: "ringraziamo queste realtà per i loro prodotti:",
          columns: 3,
          sponsors: [
            {
              alt: "Logo sponsor prodotto 1",
              src: "https://placehold.co/600x600/ffffff/d41367?text=Sponsor+C+1",
            },
            {
              alt: "Logo sponsor prodotto 2",
              src: "https://placehold.co/600x600/ffffff/d41367?text=Sponsor+C+2",
            },
            {
              alt: "Logo sponsor prodotto 3",
              src: "https://placehold.co/600x600/ffffff/d41367?text=Sponsor+C+3",
            },
            {
              alt: "Logo sponsor prodotto 4",
              src: "https://placehold.co/600x600/ffffff/d41367?text=Sponsor+C+4",
            },
            {
              alt: "Logo sponsor prodotto 5",
              src: "https://placehold.co/600x600/ffffff/d41367?text=Sponsor+C+5",
            },
            {
              alt: "Logo sponsor prodotto 6",
              src: "https://placehold.co/600x600/ffffff/d41367?text=Sponsor+C+6",
            },
          ],
        },
      ];

      const app = document.querySelector("#app");

      if (!(app instanceof HTMLDivElement)) {
        throw new Error("Container sponsor non trovato.");
      }

      const content = document.createDocumentFragment();

      for (const tier of tiers) {
        const section = document.createElement("section");
        section.className = "tier-section";

        const copy = document.createElement("p");
        copy.textContent = tier.copy;

        const grid = document.createElement("div");
        grid.className = "logo-grid";
        grid.dataset.columns = String(tier.columns);
        grid.setAttribute("aria-label", tier.copy);

        for (const sponsor of tier.sponsors) {
          const card = document.createElement("figure");
          card.className = "logo-card";

          const image = document.createElement("img");
          image.src = sponsor.src;
          image.alt = sponsor.alt;
          image.loading = "lazy";

          card.append(image);
          grid.append(card);
        }

        section.append(copy, grid);
        content.append(section);
      }

      app.replaceChildren(content);
    </script>
  </body>
</html>
